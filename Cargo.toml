[package]
name = "npkg-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "apt and dnf repositories for software released on Nostr (NIP-82)"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
hex = "0.4.3"
# The xz and zstd a .deb's control archive may be compressed with, in pure Rust.
lzma-rs = "0.3.0"
ruzstd = "0.9.0"
# OpenPGP, for signing InRelease and repomd.xml. rpgp's API wants rand 0.8.
pgp = "0.21.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
secp256k1 = { version = "0.33.1", default-features = false, features = ["global-context", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
toml = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1

# npkg configuration. The gateway reads the file --config names, or
# else the first of ~/.config/npkg/npkg.toml and
# /etc/npkg/npkg.toml.
#
# Only public_url and authors are required; the rest are shown with their
# defaults. A key the gateway doesn't know is refused.

# The URL users reach the gateway at, which the setup files point apt and dnf
# to.
public_url = "https://pkg.example.com"

# The address and port to listen on. A reverse proxy terminates TLS in front.
# bind = "127.0.0.1:8080"

# Holds npkg.sqlite and signing-key.asc. A relative path is relative
# to this file. Defaults to /var/lib/npkg as root, else
# ~/.local/share/npkg.
# data_dir = "/var/lib/npkg"

# Relays to follow NIP-82 events on.
# relays = ["wss://relay.ditto.pub", "wss://relay.primal.net", "wss://relay.ngit.dev", "wss://relay.damus.io", "wss://nos.lol", "wss://relay.zapstore.dev"]

# Blossom servers to look for package files on, when the URL an asset names
# doesn't serve it.
# blossom_servers = ["https://blossom.ditto.pub", "https://blossom.primal.net"]

# New events are picked up as they're published. Every this many seconds,
# everything is fetched again as well, in case one was missed while a relay
# was down, and files that couldn't be downloaded are tried again.
# resync_interval = 3600

# What to log, as tracing EnvFilter directives.
# log = "info"

# The team: whose NIP-82 applications the gateway follows and serves, as
# npubs or hex public keys. Every application each one publishes gets a
# repository. They can also be reached by any NIP-05 address that names them.
authors = ["npub10qdp2fc9ta6vraczxrcs8prqnv69fru2k6s2dj48gqjcylulmtjsg9arpj"]
